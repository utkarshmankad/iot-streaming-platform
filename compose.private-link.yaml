x-uplink: &uplink
  profiles: [test]
  image: iot-platform-frontend:${IOT_STACK_IMAGE_TAG:-test}
  pull_policy: never
  entrypoint: [nginx, -g, daemon off;]
  logging:
    driver: json-file
    options:
      max-size: 20m
      max-file: "5"

services:
  gateway:
    networks: !override [sensors, edge-api]
    cpus: 4.0
    environment:
      IOT_REGISTRY_URL: http://edge-listener:8081/internal/v1/registry
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ "$(cat /var/lib/iot/.iot-edge-storage 2>/dev/null)" != iot-edge-storage-v1 ] ||
           ! probe=$(mktemp /var/lib/iot/.write-check.XXXXXX); then
          echo 'Gateway storage mount is missing, uninitialized or read-only' >&2
          exit 1
        fi
        rm -- "$$probe"
        exec java -jar /app/application.jar
    volumes: !override
      - type: bind
        source: ${IOT_EDGE_STORAGE:?Initialize the private-link profile first}
        target: /var/lib/iot
        bind:
          create_host_path: false

  edge-uplink:
    <<: *uplink
    networks:
      edge-api:
        aliases: [edge-listener]
      wan: {}
    volumes:
      - ./config/nginx/edge-uplink.conf:/etc/nginx/conf.d/default.conf:ro
      - ${IOT_PRIVATE_LINK_STATE:?Initialize the private-link profile first}/edge:/run/uplink:ro

  cloud-uplink:
    <<: *uplink
    networks: [wan, gateway-api]
    volumes:
      - ./config/nginx/cloud-uplink.conf:/etc/nginx/conf.d/default.conf:ro
      - ${IOT_PRIVATE_LINK_STATE:?Initialize the private-link profile first}/cloud:/run/uplink:ro

networks:
  edge-api:
    internal: true
  wan:
    internal: true
