name: iot-platform-local

x-healthcheck: &healthcheck
  interval: 5s
  timeout: 4s
  retries: 24

x-logging: &logging
  driver: json-file
  options:
    max-size: 20m
    max-file: "5"

x-java-environment: &java-environment
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus

x-java: &java
  profiles: [local, test]
  logging: *logging
  pull_policy: never
  environment: *java-environment
  healthcheck:
    <<: *healthcheck
    test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/actuator/health/readiness]

services:
  frontend:
    profiles: [local, test]
    logging: *logging
    image: iot-platform-frontend:${IOT_STACK_IMAGE_TAG:-local}
    pull_policy: never
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${IOT_HTTP_PORT:-8080}:8080"
    networks: [dashboard, ingress]
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]

  backend:
    <<: *java
    image: iot-platform-backend:${IOT_STACK_IMAGE_TAG:-local}
    build:
      context: .
      args:
        SERVICE: backend
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: registry
      IOT_REGISTRY_JDBC_URL: jdbc:postgresql://timescaledb:5432/iot
      IOT_REGISTRY_APP_PASSWORD: ${IOT_STACK_APP_PASSWORD:-}
    networks: [dashboard, gateway-api, database]
    depends_on:
      registry-provision:
        condition: service_completed_successfully

  gateway:
    <<: *java
    image: iot-platform-gateway:${IOT_STACK_IMAGE_TAG:-local}
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: registry
      IOT_REGISTRY_URL: http://backend:8080/internal/v1/registry
      IOT_REGISTRY_GATEWAY_A_TOKEN: ${IOT_STACK_GATEWAY_A_TOKEN:-}
      IOT_REGISTRY_GATEWAY_B_TOKEN: ${IOT_STACK_GATEWAY_B_TOKEN:-}
    networks: [sensors, gateway-api]
    volumes:
      - gateway-spool:/var/lib/iot
    depends_on:
      mosquitto:
        condition: service_healthy
      backend:
        condition: service_healthy

  simulator:
    <<: *java
    image: iot-platform-simulator:${IOT_STACK_IMAGE_TAG:-local}
    build:
      context: .
      args:
        SERVICE: simulator
    group_add: ["1883"]
    environment:
      <<: *java-environment
      SPRING_PROFILES_ACTIVE: simulate
      IOT_SIM_DEVICE_A_PASSWORD: ${IOT_STACK_DEVICE_A_MQTT_PASSWORD:-}
      IOT_SIM_DEVICE_B_PASSWORD: ${IOT_STACK_DEVICE_B_MQTT_PASSWORD:-}
      IOT_SIM_SEED: ${IOT_STACK_SIM_SEED:-20260301}
      IOT_SIM_MAX_BYTES_PER_TENANT: ${IOT_STACK_SIM_MAX_BYTES_PER_TENANT:-5000000000}
    networks: [sensors]
    volumes:
      - simulator-outbox:/var/lib/iot
      - registry-acl:/run/iot-registry:ro
    depends_on:
      mosquitto:
        condition: service_healthy

  timescaledb:
    profiles: [local, test]
    logging: *logging
    image: timescale/timescaledb:2.27.0-pg17
    environment:
      POSTGRES_DB: iot
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: ${IOT_STACK_DB_PASSWORD:?Run ./scripts/stack.sh local up or test up}
      TIMESCALEDB_TELEMETRY: "off"
    networks: [database]
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']

  registry-roles:
    profiles: [local, test]
    logging: *logging
    image: timescale/timescaledb:2.27.0-pg17
    command:
      - sh
      - -ec
      - |
        : "$${IOT_MIGRATE_PASSWORD:?Missing generated registry credentials}"
        : "$${IOT_APP_PASSWORD:?Missing generated registry credentials}"
        psql -h timescaledb -U iot -d iot \
          -v migrate_password="$$IOT_MIGRATE_PASSWORD" -v app_password="$$IOT_APP_PASSWORD" \
          -f /run/registry-roles.sql
    environment:
      PGPASSWORD: ${IOT_STACK_DB_PASSWORD:?Run ./scripts/stack.sh local up or test up}
      IOT_MIGRATE_PASSWORD: ${IOT_STACK_MIGRATE_PASSWORD:-}
      IOT_APP_PASSWORD: ${IOT_STACK_APP_PASSWORD:-}
    networks: [database]
    volumes:
      - ./config/postgres/registry-roles.sql:/run/registry-roles.sql:ro
    depends_on:
      timescaledb:
        condition: service_healthy

  registry-provision:
    profiles: [local, test]
    logging: *logging
    image: iot-platform-backend:${IOT_STACK_IMAGE_TAG:-local}
    pull_policy: never
    user: "10001:1883"
    environment:
      SPRING_PROFILES_ACTIVE: registry-provision
      IOT_REGISTRY_STREAMS_PER_TYPE: ${IOT_STACK_SIM_STREAMS_PER_TYPE:-1}
      IOT_REGISTRY_JDBC_URL: jdbc:postgresql://timescaledb:5432/iot
      IOT_REGISTRY_MIGRATE_PASSWORD: ${IOT_STACK_MIGRATE_PASSWORD:-}
      IOT_REGISTRY_GATEWAY_A_TOKEN: ${IOT_STACK_GATEWAY_A_TOKEN:-}
      IOT_REGISTRY_GATEWAY_B_TOKEN: ${IOT_STACK_GATEWAY_B_TOKEN:-}
    networks: [database]
    volumes:
      - registry-acl:/var/lib/iot
    depends_on:
      registry-roles:
        condition: service_completed_successfully

  mosquitto:
    profiles: [local, test]
    logging: *logging
    image: eclipse-mosquitto:2.0.22
    user: "1883:1883"
    environment:
      MQTT_HEALTH_PASSWORD: ${IOT_STACK_MQTT_HEALTH_PASSWORD:?Run ./scripts/stack.sh local up or test up}
      GATEWAY_A_PASSWORD: ${IOT_STACK_GATEWAY_A_MQTT_PASSWORD:-}
      GATEWAY_B_PASSWORD: ${IOT_STACK_GATEWAY_B_MQTT_PASSWORD:-}
      DEVICE_A_PASSWORD: ${IOT_STACK_DEVICE_A_MQTT_PASSWORD:-}
      DEVICE_B_PASSWORD: ${IOT_STACK_DEVICE_B_MQTT_PASSWORD:-}
    depends_on:
      registry-provision:
        condition: service_completed_successfully
    command:
      - sh
      - -ec
      - |
        umask 077
        mosquitto_passwd -b -c /tmp/iot-stack-passwd scaffold_health "$$MQTT_HEALTH_PASSWORD"
        awk '/^user / { print $$2 }' /run/iot-registry/registry.acl |
          while IFS= read -r principal; do
            case "$$principal" in
              gateway-a) password=$$GATEWAY_A_PASSWORD ;;
              gateway-b) password=$$GATEWAY_B_PASSWORD ;;
              device-a) password=$$DEVICE_A_PASSWORD ;;
              device-b) password=$$DEVICE_B_PASSWORD ;;
              scaffold_health) continue ;;
              *) echo 'Registry ACL refers to an unconfigured MQTT principal' >&2; exit 1 ;;
            esac
            : "$${password:?Missing generated MQTT credentials}"
            mosquitto_passwd -b /tmp/iot-stack-passwd "$$principal" "$$password"
          done
        exec mosquitto -c /mosquitto/config/stack.conf
    networks: [sensors]
    volumes:
      - ./config/mosquitto/stack.conf:/mosquitto/config/stack.conf:ro
      - registry-acl:/run/iot-registry:ro
      - mqtt-data:/mosquitto/data
    healthcheck:
      <<: *healthcheck
      test: [CMD-SHELL, 'mosquitto_sub -h 127.0.0.1 -u scaffold_health -P "$$MQTT_HEALTH_PASSWORD" -t iot/scaffold/health -E -W 3']

  prometheus:
    profiles: [local, test]
    logging: *logging
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    networks: [monitoring, gateway-api, sensors]
    volumes:
      - ./observability/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
      - metrics-data:/prometheus
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9090/-/ready]

  alertmanager:
    profiles: [local, test]
    logging: *logging
    image: prom/alertmanager:v0.35.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    networks: [monitoring]
    volumes:
      - ./observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9093/-/ready]

  alarm-receiver:
    profiles: [local, test]
    logging: *logging
    image: nginx:1.30.7-alpine3.24
    networks: [monitoring]
    volumes:
      - ./config/nginx/alarm-receiver.conf:/etc/nginx/conf.d/default.conf:ro
      - alarm-data:/var/lib/iot/alarms
    healthcheck:
      <<: *healthcheck
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]

networks:
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  dashboard:
    internal: true
  gateway-api:
    internal: true
  sensors:
    internal: true
  database:
    internal: true
  monitoring:
    internal: true

volumes:
  database: {}
  mqtt-data: {}
  registry-acl: {}
  gateway-spool: {}
  simulator-outbox: {}
  metrics-data: {}
  alertmanager-data: {}
  alarm-data: {}
