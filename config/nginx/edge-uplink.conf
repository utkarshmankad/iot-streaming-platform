server {
    listen edge-listener:8081;
    access_log off;
    client_max_body_size 1100000;

    location /internal/v1/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        set $cloud https://cloud-uplink:8443;
        proxy_pass $cloud;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
        proxy_next_upstream off;
        proxy_ssl_protocols TLSv1.3;
        proxy_ssl_server_name on;
        proxy_ssl_name cloud-uplink;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/uplink/ca.pem;
        proxy_ssl_certificate /run/uplink/client.pem;
        proxy_ssl_certificate_key /run/uplink/client.key;
    }

    location / {
        return 404;
    }
}
