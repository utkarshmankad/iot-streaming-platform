log_format iot_json escape=json '{"time":"$time_iso8601","component":"frontend","method":"$request_method","status":$status,"duration":$request_time}';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    access_log /dev/stdout iot_json;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
