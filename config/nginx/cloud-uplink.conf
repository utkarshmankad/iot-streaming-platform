server {
    listen 8443 ssl;
    access_log off;
    client_max_body_size 1100000;

    ssl_protocols TLSv1.3;
    ssl_certificate /run/uplink/server.pem;
    ssl_certificate_key /run/uplink/server.key;
    ssl_client_certificate /run/uplink/ca.pem;
    ssl_verify_client on;

    location ~ "^/internal/v1/(registry|telemetry/batches|sensor-heartbeats|commands/(pending|[0-9a-f-]{36}/ack))$" {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
        proxy_next_upstream off;
    }

    location / {
        return 404;
    }
}
