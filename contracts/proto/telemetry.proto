syntax = "proto3";

package iot.telemetry.v1;
option java_package = "iot.platform.telemetry.proto";
option java_multiple_files = true;

message TelemetryEvent {
  optional uint32 schema_version = 1;
  string sensor_id = 2;
  string event_id = 3;
  optional int64 observed_at_ms = 4;
  optional double value = 5;
}

message TelemetryHeartbeat {
  uint32 schema_version = 1;
  string sensor_id = 2;
  int64 observed_at_ms = 3;
  bool enabled = 4;
  uint64 applied_command_version = 5;
}

message TelemetryReceipt {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    ACCEPTED = 1;
    DUPLICATE = 2;
    REJECTED = 3;
    RETRYABLE = 4;
  }
  uint32 schema_version = 1;
  string event_id = 2;
  bytes fingerprint = 3; // SHA-256 of the exact original sensor payload.
  Outcome outcome = 4;
  string reason_code = 5;
}

// An authenticated gateway sends each tenant's original MQTT payloads in a separate batch.
message TelemetryBatch {
  repeated TelemetryBatchEntry entries = 1;
}

message TelemetryBatchEntry {
  string correlation_id = 1;
  string tenant_id = 2;
  string device_id = 3;
  string sensor_id = 4;
  bytes payload = 5;
  int64 gateway_received_at_ms = 6;
}

message TelemetryBatchResponse {
  repeated TelemetryBatchResult results = 1;
}

message TelemetryBatchResult {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    COMMITTED = 1;
    DUPLICATE = 2;
    REJECTED = 3;
  }
  string correlation_id = 1;
  Outcome outcome = 2;
  string reason_code = 3;
}

message SensorHeartbeatObservation {
  string device_id = 1;
  TelemetryHeartbeat heartbeat = 2;
}

message SensorHeartbeatBatch {
  repeated SensorHeartbeatObservation observations = 1;
}
