rule_files: [alerts.yml]
evaluation_interval: 15s

tests:
  - name: sub-three-second ingest p95 interpolates within a known latency bucket
    interval: 1m
    input_series:
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="0.2"}'
        values: '0+90x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="0.3"}'
        values: '0+100x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="2.5"}'
        values: '0+100x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="3.0"}'
        values: '0+100x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="+Inf"}'
        values: '0+100x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_count'
        values: '0+100x6'
    promql_expr_test:
      - expr: round(iot_ingest_gateway_to_commit_p95_seconds, 0.000001)
        eval_time: 5m
        exp_samples:
          - labels: '{}'
            value: 0.25
    alert_rule_test:
      - eval_time: 6m
        alertname: IngestLatency
        exp_alerts: []
  - name: ingest p95 above the last finite bucket keeps the original latency alert
    interval: 1m
    input_series:
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="2.5"}'
        values: '0+80x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="3.0"}'
        values: '0+90x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="+Inf"}'
        values: '0+100x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_count'
        values: '0+100x6'
    promql_expr_test:
      - expr: iot_ingest_gateway_to_commit_p95_seconds
        eval_time: 6m
        exp_samples: []
    alert_rule_test:
      - eval_time: 6m
        alertname: IngestLatency
        exp_alerts:
          - exp_labels: {severity: warning, stage: ingest}
            exp_annotations: {summary: 'More than five percent of commits exceed 3 seconds', runbook: 'docs/local-deployment.md#alarms-and-metrics'}
  - name: insufficient ingest observations do not produce a p95 estimate
    interval: 1m
    input_series:
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="2.5"}'
        values: '0+1x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="3.0"}'
        values: '0+1x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="+Inf"}'
        values: '0+1x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_count'
        values: '0+1x6'
    promql_expr_test:
      - expr: iot_ingest_gateway_to_commit_p95_seconds
        eval_time: 5m
        exp_samples: []
  - name: legacy ingest histogram has no usable sub-three-second buckets
    interval: 1m
    input_series:
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="3.0"}'
        values: '0+100x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_bucket{le="+Inf"}'
        values: '0+100x6'
      - series: 'iot_ingest_gateway_to_commit_seconds_count'
        values: '0+100x6'
    promql_expr_test:
      - expr: iot_ingest_gateway_to_commit_p95_seconds
        eval_time: 5m
        exp_samples: []
  - name: an independently mounted gateway spool can fill while Docker storage is healthy
    interval: 15s
    input_series:
      - series: 'iot_alarm_storage_available_bytes{job="alarm-receiver",instance="alarm-receiver:8080"}'
        values: '60000000000+0x28'
      - series: 'iot_gateway_spool_storage_available_bytes{job="java-services",instance="gateway:8080"}'
        values: '20000000000+0x3 8000000000+0x7 1000000000+0x7 20000000000+0x8'
    alert_rule_test:
      - eval_time: 0m45s
        alertname: StorageHeadroom
        exp_alerts: []
      - eval_time: 2m
        alertname: StorageHeadroom
        exp_alerts:
          - exp_labels: {job: java-services, instance: 'gateway:8080', severity: warning, stage: storage, condition: disk}
            exp_annotations: {summary: 'Docker or gateway spool storage has less than 10 GB free', runbook: 'docs/local-deployment.md#alarms-and-metrics'}
      - eval_time: 3m30s
        alertname: StorageHeadroomCritical
        exp_alerts:
          - exp_labels: {job: java-services, instance: 'gateway:8080', severity: critical, stage: storage, condition: disk}
            exp_annotations: {summary: 'Docker or gateway spool storage has less than 5 GB free', runbook: 'docs/local-deployment.md#alarms-and-metrics'}
      - eval_time: 6m
        alertname: StorageHeadroom
        exp_alerts: []
      - eval_time: 6m
        alertname: StorageHeadroomCritical
        exp_alerts: []
  - name: queue warnings, critical escalation, and recovery
    interval: 15s
    input_series:
      - series: 'iot_gateway_spool_bytes{tenant="tenant-a",instance="gateway:8080"}'
        values: '75+0x22 95+0x10 60+0x12'
      - series: 'iot_gateway_spool_capacity_bytes{tenant="tenant-a",instance="gateway:8080"}'
        values: '100+0x47'
    alert_rule_test:
      - eval_time: 4m45s
        alertname: QueueCapacity
        exp_alerts: []
      - eval_time: 5m
        alertname: QueueCapacity
        exp_alerts:
          - exp_labels: {tenant: tenant-a, instance: 'gateway:8080', severity: warning, stage: delivery, condition: queue}
            exp_annotations: {summary: 'Queue is above 70 percent of its configured budget', runbook: 'docs/local-deployment.md#alarms-and-metrics'}
      - eval_time: 8m
        alertname: QueueCapacityCritical
        exp_alerts:
          - exp_labels: {tenant: tenant-a, instance: 'gateway:8080', severity: critical, stage: delivery, condition: queue}
            exp_annotations: {summary: 'Queue is above 90 percent of its configured budget', runbook: 'docs/local-deployment.md#alarms-and-metrics'}
      - eval_time: 9m45s
        alertname: QueueCapacity
        exp_alerts: []
      - eval_time: 9m45s
        alertname: QueueCapacityCritical
        exp_alerts: []
  - name: a missing target and missing backup data are unknown
    interval: 15s
    input_series:
      - series: 'up{job="alertmanager",instance="alertmanager:9093"}'
        values: '1+0x24'
      - series: 'up{job="alarm-receiver",instance="alarm-receiver:8080"}'
        values: '1+0x24'
      - series: 'iot_backup_monitoring_enabled'
        values: '1+0x24'
    alert_rule_test:
      - eval_time: 1m
        alertname: MonitoringTargetsMissing
        exp_alerts:
          - exp_labels: {job: java-services, severity: warning, stage: monitoring}
            exp_annotations: {summary: 'Expected monitoring target is missing', runbook: 'docs/local-deployment.md#alarms-and-metrics'}
      - eval_time: 1m
        alertname: BackupMetricsMissing
        exp_alerts:
          - exp_labels: {severity: warning, stage: backup}
            exp_annotations: {summary: 'The backup status publisher has not reported a usable timestamp', runbook: 'docs/local-deployment.md#alarms-and-metrics'}
      - eval_time: 1m
        alertname: BackupOverdue
        exp_alerts: []
  - name: a full queue pages without waiting for sustained capacity pressure
    interval: 15s
    input_series:
      - series: 'iot_simulator_pending_bytes{tenant="tenant-a",instance="simulator:8080"}'
        values: '100 60+0x5'
      - series: 'iot_simulator_pending_capacity_bytes{tenant="tenant-a",instance="simulator:8080"}'
        values: '100+0x6'
    alert_rule_test:
      - eval_time: 0s
        alertname: QueueFull
        exp_alerts:
          - exp_labels: {tenant: tenant-a, instance: 'simulator:8080', severity: critical, stage: delivery, condition: queue}
            exp_annotations: {summary: 'Queue is full or is rejecting admissions temporarily', runbook: 'docs/local-deployment.md#alarms-and-metrics'}
      - eval_time: 45s
        alertname: QueueFull
        exp_alerts: []
  - name: an overdue verified backup is critical
    interval: 1h
    input_series:
      - series: 'iot_backup_monitoring_enabled'
        values: '1+0x28'
      - series: 'iot_backup_verified_timestamp_seconds'
        values: '5+0x28'
    alert_rule_test:
      - eval_time: 26h
        alertname: BackupOverdue
        exp_alerts: []
      - eval_time: 27h
        alertname: BackupOverdue
        exp_alerts:
          - exp_labels: {severity: critical, stage: backup}
            exp_annotations: {summary: 'The last verified backup is over 26 hours old', runbook: 'docs/local-deployment.md#alarms-and-metrics'}
