syntax = "proto3";

package iot.telemetry.v1;
option java_package = "iot.platform.telemetry.proto";
option java_multiple_files = true;

message TelemetryEvent {
  optional uint32 schema_version = 1;
  string sensor_id = 2;
  string event_id = 3;
  optional int64 observed_at_ms = 4;
  optional double value = 5;
}

message TelemetryHeartbeat {
  uint32 schema_version = 1;
  string sensor_id = 2;
  int64 observed_at_ms = 3;
  bool enabled = 4;
  uint64 applied_command_version = 5;
}

message TelemetryReceipt {
  enum Outcome {
    OUTCOME_UNSPECIFIED = 0;
    ACCEPTED = 1;
    DUPLICATE = 2;
    REJECTED = 3;
    RETRYABLE = 4;
  }
  uint32 schema_version = 1;
  string event_id = 2;
  bytes fingerprint = 3; // SHA-256 of the exact original sensor payload.
  Outcome outcome = 4;
  string reason_code = 5;
}
