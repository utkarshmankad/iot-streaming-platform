global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: java-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080", "gateway:8080", "simulator:8080"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: alarm-receiver
    static_configs:
      - targets: ["alarm-receiver:8080"]
