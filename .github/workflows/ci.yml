name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  detect:
    name: Detect project state
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.state.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: state
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci/detect.sh "$BASE_SHA"

  pr-hygiene:
    name: PR hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            test
            refactor
            docs
            build
            chore
            ci
            perf
            deps
      - name: Check branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" =~ ^dependabot/ ]]; then exit 0; fi
          [[ "$HEAD_REF" =~ ^(feat|fix|test|refactor|docs|build|chore|ci|perf|deps)/[a-z0-9][a-z0-9._-]*$ ]]

  repo-guards:
    name: Repo guards (PII, secrets, workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check tracked private data and trunk configuration
        run: python3 scripts/ci/repo-guards.py
      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  style:
    name: Format and style
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: ./gradlew spotlessCheck --no-daemon
      - run: npm exec --yes --package=@redocly/cli@2.82.0 -- redocly lint --extends=spec contracts/openapi/browser-v1.yaml
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run build

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: ./gradlew test --no-daemon
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: unit-results
          path: |
            **/build/test-results/test/*.xml
          if-no-files-found: ignore
          retention-days: 14

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew integrationTest --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-results
          path: |
            **/build/test-results/integrationTest/*.xml
          if-no-files-found: ignore
          retention-days: 14

  static-analysis:
    name: Static analysis (SpotBugs + FindSecBugs)
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew spotbugsMain --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: spotbugs
          path: |
            **/build/reports/spotbugs/**
          if-no-files-found: ignore
          retention-days: 14

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    needs: detect
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: java-kotlin,javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          output: codeql-results
      - name: Reject error-level findings
        run: |
          jq -se '[
            .[] | .runs[] as $run | $run.results[]? as $result
            | select(($result.level
                // $run.tool.driver.rules[$result.ruleIndex // 2147483647].defaultConfiguration.level
                // "warning") == "error")
          ] | length == 0' codeql-results/*.sarif

  dependencies:
    name: Dependency vulnerabilities
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan locked Java and JavaScript dependencies
        run: |
          docker run --rm -v "$PWD:/repo:ro" aquasec/trivy:0.76.2 fs \
            --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /repo
      - name: Review changed vulnerabilities and licenses
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          retry-on-snapshot-warnings: true
          deny-licenses: AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later, GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later

  container:
    name: Container build and image scan
    runs-on: ubuntu-latest
    needs: detect
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
      - run: ./scripts/stack.sh test build
        env:
          COMPOSE_PARALLEL_LIMIT: '1'
      - name: Scan the application images for fixable high and critical findings
        run: bash scripts/ci/scan-images.sh
      - name: Package the scanned images
        run: |
          docker save iot-platform-{backend,gateway,simulator,frontend}:test | gzip > stack-images.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-images
          path: stack-images.tar.gz
          compression-level: 0
          retention-days: 1

  coverage:
    name: Coverage gate
    runs-on: ubuntu-latest
    needs: [unit, integration]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew jacocoMergedReport jacocoMergedCoverageVerification --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: jacoco
          path: |
            build/reports/jacoco/jacocoMergedReport/**
          if-no-files-found: ignore
          retention-days: 14

  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: container
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stack-images
      - run: docker load --input stack-images.tar.gz
      - run: ./scripts/stack.sh test up-built
      - run: bash scripts/ci/smoke.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm --prefix frontend ci
      - working-directory: frontend
        run: npm exec -- playwright install --with-deps --only-shell chromium
      - name: Test the dashboard in Chromium
        run: bash scripts/ci/browser.sh
      - name: Collect Compose logs and remove disposable volumes
        if: always()
        run: |
          mkdir -p build/ci
          if [[ -f .env.test ]]; then
            log_status=0
            docker compose --env-file .env.test -p iot-platform-ci --profile test logs --no-color > build/ci/compose.log || log_status=$?
            ./scripts/stack.sh test reset
            exit "$log_status"
          fi
      - name: Verify telemetry fault recovery
        run: python3 scripts/ci/telemetry-faults.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: smoke
          path: |
            build/ci/compose.log
            build/ci/browser.xml
            build/ci/faults/
          if-no-files-found: ignore
          retention-days: 14

  performance:
    name: Performance test
    runs-on: ubuntu-latest
    needs: [detect, smoke]
    if: needs.detect.outputs.docs_only != 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25.0.5+8"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stack-images
      - run: docker load --input stack-images.tar.gz
      - run: ./scripts/stack.sh test up-built
        env:
          IOT_STACK_SIM_STREAMS_PER_TYPE: '11'
      - run: bash scripts/ci/performance.sh
      - name: Collect Compose logs and remove disposable volumes
        if: always()
        run: |
          mkdir -p build/ci
          if [[ -f .env.test ]]; then
            log_status=0
            docker compose --env-file .env.test -p iot-platform-ci --profile test logs --no-color > build/ci/compose.log || log_status=$?
            ./scripts/stack.sh test reset
            exit "$log_status"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: performance
          path: |
            perf/build/reports/gatling/**
            build/ci/performance-ingest.txt
            build/ci/compose.log
          if-no-files-found: ignore
          retention-days: 14

  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [detect, pr-hygiene, repo-guards, style, unit, integration, static-analysis, codeql, dependencies, container, coverage, smoke, performance]
    steps:
      - name: Verify every required stage
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
          DOCS_ONLY: ${{ needs.detect.outputs.docs_only }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e --arg event "$EVENT" --arg docs "$DOCS_ONLY" '
            to_entries | all(
              if .key == "pr-hygiene" and $event != "pull_request" then .value.result == "skipped"
              elif .key == "performance" and $docs == "true" then .value.result == "skipped"
              else .value.result == "success"
              end
            )'
