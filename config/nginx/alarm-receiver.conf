server {
    listen 8080;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location = /webhook {
        # M3.3 installs the durable receiver. Pending deliveries must see failure.
        return 503;
    }

    location / {
        return 404;
    }
}
