route:
  receiver: local
  group_by: [alertname, stage, tenant, instance]
  group_wait: 5s
  group_interval: 15s
  repeat_interval: 4h
  routes:
    - receiver: local
      matchers: ['alertname="Watchdog"']
      repeat_interval: 30s

inhibit_rules:
  - source_matchers: ['severity="critical"', 'condition=~".+"']
    target_matchers: ['severity="warning"', 'condition=~".+"']
    equal: [stage, tenant, instance, condition]
  - source_matchers: ['alertname=~"TargetUnavailable|DatabaseUnavailable"', 'instance=~"backend:8080|gateway:8080"']
    target_matchers: ['alertname="EnabledSensorsNotReporting"']

receivers:
  - name: local
    webhook_configs:
      - url: http://alarm-receiver:8080/webhook
        send_resolved: true
        http_config:
          authorization:
            credentials_file: /tmp/iot-alarm-webhook
