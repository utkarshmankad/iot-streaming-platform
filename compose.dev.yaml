name: iot-dev

services:
  timescaledb:
    image: timescale/timescaledb:2.27.0-pg17
    environment:
      POSTGRES_DB: iot_dev
      POSTGRES_USER: iot_dev
      POSTGRES_PASSWORD: ${IOT_DEV_DB_PASSWORD:?Run ./scripts/init-dev-env.sh first}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:${IOT_DEV_DB_PORT:-15432}:5432"
    volumes:
      - dev-db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  mosquitto:
    image: eclipse-mosquitto:2.0.22
    user: "1883:1883"
    environment:
      MQTT_DEV_PASSWORD: ${IOT_DEV_MQTT_PASSWORD:?Run ./scripts/init-dev-env.sh first}
    command:
      - sh
      - -ec
      - |
        umask 077
        mosquitto_passwd -b -c /tmp/iot-dev-passwd iot_dev "$$MQTT_DEV_PASSWORD"
        exec mosquitto -c /mosquitto/config/iot-dev.conf
    ports:
      - "127.0.0.1:${IOT_DEV_MQTT_PORT:-11883}:1883"
    volumes:
      - ./config/mosquitto/dev.conf:/mosquitto/config/iot-dev.conf:ro
    healthcheck:
      test: [CMD-SHELL, 'mosquitto_sub -h 127.0.0.1 -u iot_dev -P "$$MQTT_DEV_PASSWORD" -t iot/dev/health -E -W 3']
      interval: 5s
      timeout: 4s
      retries: 20

volumes:
  dev-db:
